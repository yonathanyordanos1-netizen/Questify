<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questify — League Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#FF6B35;
    --coral-deep:#E2551F;
    --peach:#F2F2F3;
    --sage:#6B7280;
    --canvas:#FAFAFA;
    --ink:#1A1B1E;
    --muted:#6B7280;
    --card-border:#E7E7E8;
    --white:#FFFFFF;
    --display:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--display);
    background:#ECECED;
    min-height:100vh;
    display:grid;
    place-items:center;
    gap:18px;
    padding:24px;
  }
  .stage-label{
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#6B7280;
    text-align:center;
    margin-top:-8px;
  }
  .phone{
    width:390px;
    height:844px;
    background:#1A1A1B;
    border-radius:54px;
    padding:10px;
    box-shadow:0 34px 70px rgba(26,27,30,.28),0 6px 16px rgba(26,27,30,.10);
    position:relative;
  }
  .screen{
    width:100%;
    height:100%;
    border-radius:46px;
    overflow:hidden;
    background:var(--canvas);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .island{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:126px;
    height:34px;
    background:#000;
    border-radius:20px;
    z-index:6;
  }
  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 28px 0;
    color:var(--ink);
    z-index:5;
  }
  .statusbar .time{font-size:15px;font-weight:700;letter-spacing:.02em}
  .status-icons{display:flex;align-items:center;gap:6px}
  .status-icons svg{display:block}
  .topnav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px 0;
  }
  .back-btn{
    width:44px;
    height:44px;
    border-radius:14px;
    border:1px solid var(--card-border);
    background:var(--white);
    display:grid;
    place-items:center;
    cursor:pointer;
    color:var(--ink);
    text-decoration:none;
    transition:transform .15s ease,background .15s ease;
  }
  .back-btn:hover{background:#FFFFFF}
  .back-btn:active{transform:scale(.95)}
  .step-badge{
    height:34px;
    padding:0 14px;
    border-radius:999px;
    background:rgba(26,27,30,.05);
    color:var(--ink);
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
  }
  .progress-wrap{
    padding:16px 20px 0;
  }
  .progress-track{
    height:6px;
    border-radius:999px;
    background:var(--card-border);
    overflow:hidden;
  }
  .progress-fill{
    display:block;
    height:100%;
    width:61%;
    border-radius:999px;
    background:var(--coral);
    animation:grow 1.1s cubic-bezier(.22,1.2,.36,1) .15s both;
    transform-origin:left;
  }
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .league-body{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:22px 24px 24px;
    overflow:hidden;
  }
  .mascot-mini{width:52px;height:52px;margin-bottom:12px}
  .league-title{
    font-size:26px;
    font-weight:800;
    letter-spacing:-.02em;
    color:var(--ink);
    line-height:1.2;
    margin-bottom:8px;
  }
  .league-sub{
    font-size:15px;
    font-weight:500;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:22px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
    flex:1;
  }
  .option-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--white);
    border:2px solid var(--card-border);
    border-radius:18px;
    padding:16px;
    cursor:pointer;
    transition:border-color .15s ease,background .15s ease,transform .1s ease;
    position:relative;
    text-align:left;
    font-family:var(--display);
  }
  .option-card:hover{border-color:#D8D8DA}
  .option-card:active{transform:scale(.99)}
  .option-card[aria-pressed="true"]{
    border-color:var(--coral);
    background:#FFFFFF;
  }
  .icon-tile{
    width:48px;
    height:48px;
    border-radius:15px;
    background:rgba(26,27,30,.05);
    color:var(--coral);
    display:grid;
    place-items:center;
    flex-shrink:0;
    transition:background .15s ease;
  }
  .option-card[aria-pressed="true"] .icon-tile{
    background:rgba(26,27,30,.05);
    color:var(--coral-deep);
  }
  .icon-tile svg{
    display:block;
    filter:drop-shadow(0 2px 3px rgba(26,27,30,.28));
  }
  .opt-txt{flex:1}
  .opt-title{
    font-size:16px;
    font-weight:800;
    color:var(--ink);
    line-height:1.3;
  }
  .opt-sub{
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    margin-top:2px;
    line-height:1.35;
  }
  .check-chip{
    width:24px;
    height:24px;
    border-radius:999px;
    border:2px solid #D8CFC2;
    display:grid;
    place-items:center;
    flex-shrink:0;
    color:#fff;
    opacity:0;
    transform:scale(.6);
    transition:opacity .15s ease,transform .15s ease;
  }
  .check-chip svg{display:block}
  .option-card[aria-pressed="true"] .check-chip{
    background:var(--coral);
    border-color:var(--coral);
    opacity:1;
    transform:scale(1);
  }
  .continue-wrap{
    padding-top:18px;
  }
  .continue-btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:999px;
    background:var(--coral);
    color:var(--white);
    font-family:var(--display);
    font-size:17px;
    font-weight:700;
    letter-spacing:.01em;
    cursor:pointer;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 0 var(--coral-deep);
    transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease;
  }
  .continue-btn:hover{filter:brightness(1.03)}
  .continue-btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 var(--coral-deep);
  }
  .continue-btn.disabled{
    opacity:.45;
    pointer-events:none;
    box-shadow:0 4px 0 rgba(26,27,30,.12);
  }
</style>
</head>
<body>
  <div class="phone" data-od-id="league-screen">
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar" data-od-id="league-status">
        <span class="time">9:41</span>
        <span class="status-icons" aria-hidden="true">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
            <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/>
            <rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/>
            <rect x="10" y="2" width="3" height="10" rx="1" fill="currentColor"/>
            <rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".35"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
            <rect x="0" y="6" width="10" height="6" rx="2" fill="currentColor"/>
            <path d="M12 3.5a5 5 0 0 1 0 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M14 1a9 9 0 0 1 0 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
            <rect x="0" y="1" width="22" height="10" rx="3" fill="currentColor"/>
            <path d="M24 4v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <rect x="2" y="3" width="16" height="6" rx="1.5" fill="var(--coral)"/>
          </svg>
        </span>
      </div>
      <div class="topnav">
        <a class="back-btn" data-od-id="league-back" href="questify-proof.html" aria-label="Back to photo proof">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <span class="step-badge" data-od-id="league-badge">Step 11 of 18</span>
      </div>
      <div class="progress-wrap" data-od-id="league-progress">
        <div class="progress-track"><span class="progress-fill"></span></div>
      </div>
      <div class="league-body">
        <svg class="mascot-mini" data-od-id="league-mascot" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Questie the Questify mascot">
          <path d="M60 4 L74 26 Q60 36 46 26 Z" fill="#F4A261"/>
          <path d="M60 10 L68 24 Q60 29 52 24 Z" fill="#E76F51"/>
          <circle cx="60" cy="64" r="46" fill="#FFFFFF" stroke="#E7E7E8" stroke-width="2"/>
          <circle cx="48" cy="62" r="5" fill="#1A1B1E"/>
          <circle cx="72" cy="62" r="5" fill="#1A1B1E"/>
          <path d="M50 72 Q60 81 70 72" stroke="#1A1B1E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <circle cx="38" cy="70" r="6" fill="#E76F51" opacity=".25"/>
          <circle cx="82" cy="70" r="6" fill="#E76F51" opacity=".25"/>
        </svg>
        <h1 class="league-title" data-od-id="league-title">How do you want to compete?</h1>
        <p class="league-sub" data-od-id="league-subtitle">You'll face 7 rivals of similar strength each week. Top 3 jump up, bottom 3 drop — pick your league drive.</p>
        <div class="options" data-od-id="league-options" role="radiogroup" aria-label="League drive">
          <button class="option-card" data-od-id="league-option-bronze" role="radio" aria-checked="false" aria-pressed="false" data-next="questify-shield.html">
            <span class="icon-tile" aria-hidden="true">
              <svg width="30" height="30" viewBox="0 0 48 48" role="img" aria-label="3D bronze medal">
                <defs>
                  <linearGradient id="brb" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#C9823F"/>
                    <stop offset="1" stop-color="#9E5C1F"/>
                  </linearGradient>
                  <radialGradient id="brd" cx=".35" cy=".3" r="1">
                    <stop offset="0" stop-color="#E7E7E8"/>
                    <stop offset=".5" stop-color="#CD7F32"/>
                    <stop offset="1" stop-color="#8F5118"/>
                  </radialGradient>
                </defs>
                <path d="M19 20 L9 4 L15.5 4 L20 15 Z" fill="url(#brb)"/>
                <path d="M29 20 L39 4 L32.5 4 L28 15 Z" fill="url(#brb)"/>
                <circle cx="24" cy="30" r="15" fill="url(#brd)"/>
                <circle cx="24" cy="30" r="15" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.6"/>
                <circle cx="24" cy="30" r="10.5" fill="none" stroke="rgba(70,36,6,.4)" stroke-width="1.4"/>
                <path d="M12 36.5 a15 15 0 0 0 24 0" stroke="rgba(70,36,6,.35)" stroke-width="3" stroke-linecap="round" fill="none"/>
                <path d="M24 25.5 l1.7 3.5 3.9 .55 -2.8 2.8 .65 3.9 -3.45 -1.85 -3.45 1.85 .65 -3.9 -2.8 -2.8 3.9 -.55 Z" fill="#6B3E10"/>
              </svg>
            </span>
            <span class="opt-txt">
              <span class="opt-title">Bronze League — Casual</span>
              <span class="opt-sub">Laid-back pace, friendly rivalries</span>
            </span>
            <span class="check-chip" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12l5 5L20 6"/>
              </svg>
            </span>
          </button>
          <button class="option-card" data-od-id="league-option-competitive" role="radio" aria-checked="false" aria-pressed="false" data-next="questify-shield.html">
            <span class="icon-tile" aria-hidden="true">
              <svg width="30" height="30" viewBox="0 0 48 48" role="img" aria-label="3D silver medal">
                <defs>
                  <linearGradient id="sib" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#C6CCD6"/>
                    <stop offset="1" stop-color="#8B95A5"/>
                  </linearGradient>
                  <radialGradient id="sid" cx=".35" cy=".3" r="1">
                    <stop offset="0" stop-color="#F7F7F8"/>
                    <stop offset=".5" stop-color="#C9CED6"/>
                    <stop offset="1" stop-color="#8791A2"/>
                  </radialGradient>
                </defs>
                <path d="M19 20 L9 4 L15.5 4 L20 15 Z" fill="url(#sib)"/>
                <path d="M29 20 L39 4 L32.5 4 L28 15 Z" fill="url(#sib)"/>
                <circle cx="24" cy="30" r="15" fill="url(#sid)"/>
                <circle cx="24" cy="30" r="15" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/>
                <circle cx="24" cy="30" r="10.5" fill="none" stroke="rgba(90,100,115,.45)" stroke-width="1.4"/>
                <path d="M12 36.5 a15 15 0 0 0 24 0" stroke="rgba(90,100,115,.4)" stroke-width="3" stroke-linecap="round" fill="none"/>
                <path d="M24 25 L20.5 30 H23 L21.5 34.5 L28.5 28 H25.5 Z" fill="#5E6675"/>
              </svg>
            </span>
            <span class="opt-txt">
              <span class="opt-title">Silver / Gold — Competitive</span>
              <span class="opt-sub">Climb weekly, earn bonus XP</span>
            </span>
            <span class="check-chip" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12l5 5L20 6"/>
              </svg>
            </span>
          </button>
          <button class="option-card" data-od-id="league-option-diamond" role="radio" aria-checked="false" aria-pressed="false" data-next="questify-shield.html">
            <span class="icon-tile" aria-hidden="true">
              <svg width="30" height="30" viewBox="0 0 48 48" role="img" aria-label="3D diamond gem">
                <defs>
                  <linearGradient id="gmC" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#F4F4F5"/>
                    <stop offset="1" stop-color="#9AA0A6"/>
                  </linearGradient>
                  <linearGradient id="gmP" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#6B7280"/>
                    <stop offset="1" stop-color="#34363A"/>
                  </linearGradient>
                </defs>
                <path d="M10 20 L38 20 L24 41 Z" fill="url(#gmP)"/>
                <path d="M24 20 L38 20 L24 41 Z" fill="#4B4B52" opacity=".7"/>
                <path d="M10 20 L38 20 L30 11 L18 11 Z" fill="url(#gmC)"/>
                <path d="M18 11 L24 6.5 L30 11 L24 15 Z" fill="#FFFFFF" opacity=".55"/>
                <path d="M10 20 L38 20" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.6"/>
                <path d="M10 20 L18 11 M38 20 L30 11" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1"/>
                <path d="M24 15 L24 41" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="1"/>
                <path d="M37 5 l1.1 2.6 2.6 1.1 -2.6 1.1 -1.1 2.6 -1.1 -2.6 -2.6 -1.1 2.6 -1.1 Z" fill="#FFFFFF"/>
              </svg>
            </span>
            <span class="opt-txt">
              <span class="opt-title">Diamond — Hardcore</span>
              <span class="opt-sub">Zero slack, top ranks only</span>
            </span>
            <span class="check-chip" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12l5 5L20 6"/>
              </svg>
            </span>
          </button>
        </div>
        <div class="continue-wrap">
          <a class="continue-btn disabled" data-od-id="league-continue" href="questify-shield.html" aria-disabled="true">Continue ➔</a>
        </div>
      </div>
    </div>
  </div>
  <p class="stage-label">Questify · League Drive · Step 11 of 18 · 390 × 844</p>
  <script>
    (function(){
      var cards = document.querySelectorAll('[data-od-id="league-options"] .option-card');
      var btn = document.querySelector('[data-od-id="league-continue"]');
      cards.forEach(function(card){
        card.addEventListener('click', function(){
          cards.forEach(function(c){c.setAttribute('aria-pressed','false');c.setAttribute('aria-checked','false')});
          card.setAttribute('aria-pressed','true');
          card.setAttribute('aria-checked','true');
          btn.classList.remove('disabled');
          btn.setAttribute('aria-disabled','false');
        });
      });
    })();
  </script>
</body>
</html>

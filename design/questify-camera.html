<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questify — Photo Proof Camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#FF6B35;
    --coral-deep:#E2551F;
    --peach:#F2F2F3;
    --sage:#6B7280;
    --canvas:#FAFAFA;
    --ink:#1A1B1E;
    --muted:#6B7280;
    --white:#FFFFFF;
    --display:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--display);
    background:#ECECED;
    min-height:100vh;
    display:grid;
    place-items:center;
    gap:18px;
    padding:24px;
  }
  .stage-label{
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#6B7280;
    text-align:center;
    margin-top:-8px;
  }
  .phone{
    width:390px;
    height:844px;
    background:#1A1A1B;
    border-radius:54px;
    padding:10px;
    box-shadow:0 34px 70px rgba(26,27,30,.28),0 6px 16px rgba(26,27,30,.10);
    position:relative;
  }
  .screen{
    width:100%;
    height:100%;
    border-radius:46px;
    overflow:hidden;
    background:#0F0F10;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .island{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:126px;
    height:34px;
    background:#000;
    border-radius:20px;
    z-index:6;
  }
  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 28px 0;
    color:var(--white);
    z-index:5;
  }
  .statusbar .time{font-size:15px;font-weight:700;letter-spacing:.02em}
  .status-icons{display:flex;align-items:center;gap:6px}
  .status-icons svg{display:block}
  .cam-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px 0;
    position:relative;
    z-index:4;
  }
  .cam-back{
    width:44px;
    height:44px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.4);
    display:grid;
    place-items:center;
    color:var(--white);
    text-decoration:none;
    transition:transform .15s ease,background .15s ease;
  }
  .cam-back:hover{background:rgba(0,0,0,.6)}
  .cam-back:active{transform:scale(.95)}
  .task-chip{
    height:34px;
    padding:0 14px;
    border-radius:999px;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.18);
    color:var(--white);
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .task-chip svg{display:block}
  .vf{
    position:absolute;
    inset:0;
  }
  .vf-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity .4s ease;
  }
  .vf-photo.on{opacity:1}
  .vf-dim{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.18);
  }
  .reticle{
    position:absolute;
    width:52px;
    height:52px;
    border:3px solid var(--coral);
    z-index:3;
    filter:drop-shadow(0 0 6px rgba(26,27,30,.25));
  }
  .reticle.tl{top:18px;left:18px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
  .reticle.tr{top:18px;right:18px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
  .reticle.bl{bottom:150px;left:18px;border-right:0;border-top:0;border-radius:0 0 0 12px}
  .reticle.br{bottom:150px;right:18px;border-left:0;border-top:0;border-radius:0 0 12px 0}
  .scan-line{
    position:absolute;
    left:26px;
    right:26px;
    top:200px;
    height:3px;
    background:var(--coral);
    box-shadow:0 0 16px rgba(26,27,30,.25);
    z-index:3;
    opacity:0;
  }
  .scan-line.on{animation:scan 1.6s ease-in-out infinite}
  .scan-line.on{opacity:1}
  @keyframes scan{0%,100%{transform:translateY(-110px)}50%{transform:translateY(110px)}}
  .vf-pill{
    position:absolute;
    top:120px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.6);
    color:#fff;
    font-size:12px;
    font-weight:700;
    letter-spacing:.02em;
    padding:8px 16px;
    border-radius:999px;
    z-index:4;
    white-space:nowrap;
    backdrop-filter:blur(4px);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .vf-pill .spin{
    width:12px;
    height:12px;
    border-radius:999px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;
    display:inline-block;
    opacity:0;
  }
  .vf-pill.scanning .spin{opacity:1;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .controls{
    position:absolute;
    left:0;right:0;bottom:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:0 0 40px;
    z-index:5;
  }
  .shutter-row{
    display:flex;
    align-items:center;
    gap:26px;
  }
  .side-btn{
    width:52px;
    height:52px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.4);
    color:#fff;
    display:grid;
    place-items:center;
    text-decoration:none;
  }
  .shutter{
    width:76px;
    height:76px;
    border-radius:999px;
    border:4px solid rgba(255,255,255,.9);
    background:var(--coral);
    cursor:pointer;
    display:grid;
    place-items:center;
    color:#fff;
    transition:transform .15s ease,filter .15s ease;
  }
  .shutter:hover{filter:brightness(1.06)}
  .shutter:active{transform:scale(.92)}
  .mark-later{
    color:rgba(255,255,255,.7);
    font-size:14px;
    font-weight:700;
    text-decoration:none;
    padding:6px 12px;
  }
  .mark-later:hover{color:#fff}
  .verdict-sheet{
    position:absolute;
    left:0;right:0;bottom:0;
    background:var(--canvas);
    border-radius:28px 28px 0 0;
    padding:22px 24px 30px;
    z-index:8;
    transform:translateY(105%);
    transition:transform .35s cubic-bezier(.22,1,.36,1);
  }
  .verdict-sheet.open{transform:translateY(0)}
  .grabber{
    width:44px;
    height:5px;
    border-radius:999px;
    background:var(--card-border);
    margin:0 auto 16px;
  }
  .sage-banner{
    display:flex;
    align-items:center;
    gap:12px;
    background:rgba(26,27,30,.05);
    border:1px solid rgba(26,27,30,.15);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .sage-banner .sb-ic{
    width:38px;
    height:38px;
    border-radius:12px;
    background:var(--sage);
    color:#fff;
    display:grid;
    place-items:center;
    flex-shrink:0;
  }
  .sb-title{font-size:15px;font-weight:800;color:var(--ink)}
  .sb-sub{font-size:12px;font-weight:700;color:var(--muted)}
  .reward-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-bottom:16px;
  }
  .reward{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    font-weight:800;
    color:var(--ink);
  }
  .reward .r-ic{
    width:30px;
    height:30px;
    border-radius:10px;
    display:grid;
    place-items:center;
    color:#fff;
  }
  .r-ic.xp{background:rgba(26,27,30,.05);color:#4B4B52}
  .r-ic.trophy{background:rgba(26,27,30,.05);color:#6B7280}
  .mascot-celebrate{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:18px;
  }
  .celeb-flame{
    width:30px;
    height:30px;
    border-radius:10px;
    background:rgba(26,27,30,.06);
    color:#4B4B52;
    display:grid;
    place-items:center;
    animation:pop .5s ease .15s both;
  }
  @keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.15)}100%{transform:scale(1)}}
  .mascot-face{width:52px;height:52px;animation:pop .5s ease both}
  .done-btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:999px;
    background:var(--coral);
    color:var(--white);
    font-family:var(--display);
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 0 var(--coral-deep);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .done-btn:hover{filter:brightness(1.03)}
  .done-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral-deep)}
  .fail-link{
    text-align:center;
    margin-top:12px;
    font-size:13px;
    font-weight:700;
    color:var(--muted);
  }
  .fail-link a{color:var(--coral-deep);text-decoration:none}
</style>
</head>
<body>
  <div class="phone" data-od-id="cam-screen">
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar" data-od-id="cam-status">
        <span class="time">9:41</span>
        <span class="status-icons" aria-hidden="true">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
            <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/>
            <rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/>
            <rect x="10" y="2" width="3" height="10" rx="1" fill="currentColor"/>
            <rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".35"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
            <rect x="0" y="6" width="10" height="6" rx="2" fill="currentColor"/>
            <path d="M12 3.5a5 5 0 0 1 0 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M14 1a9 9 0 0 1 0 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
            <rect x="0" y="1" width="22" height="10" rx="3" fill="currentColor"/>
            <path d="M24 4v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <rect x="2" y="3" width="16" height="6" rx="1.5" fill="var(--coral)"/>
          </svg>
        </span>
      </div>
      <div class="vf" data-od-id="cam-vf">
        <img class="vf-photo" data-od-id="cam-photo" src="image.png" alt="Photo proof in viewfinder">
        <span class="vf-dim" aria-hidden="true"></span>
        <span class="reticle tl" aria-hidden="true"></span>
        <span class="reticle tr" aria-hidden="true"></span>
        <span class="reticle bl" aria-hidden="true"></span>
        <span class="reticle br" aria-hidden="true"></span>
        <span class="scan-line" data-od-id="cam-scanline" aria-hidden="true"></span>
        <span class="vf-pill" data-od-id="cam-pill">Clean Room · 07:00</span>
      </div>
      <div class="cam-top">
        <a class="cam-back" data-od-id="cam-back" href="questify-dashboard.html" aria-label="Close camera">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </a>
        <span class="task-chip" data-od-id="cam-task">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/>
          </svg>
          Photo proof · Clean Room
        </span>
      </div>
      <div class="controls" data-od-id="cam-controls">
        <div class="shutter-row">
          <a class="side-btn" data-od-id="cam-gallery" href="questify-dashboard.html" aria-label="Gallery">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>
            </svg>
          </a>
          <button class="shutter" data-od-id="cam-shutter" aria-label="Take photo">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.5 5.5a2.5 2.5 0 1 1 3.6 2.1"/>
              <path d="M2 20V8a2 2 0 0 1 2-2h1.5l2-2h5l2 2H20a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2Z"/>
              <circle cx="12" cy="13" r="3.5"/>
            </svg>
          </button>
          <a class="side-btn" data-od-id="cam-flip" href="javascript:void(0)" aria-label="Flip camera">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 17H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h2l2-3h6l2 3h2a1 1 0 0 1 1 1v3"/>
              <path d="M21 16.5a5.5 5.5 0 0 1-5 3.5 5.5 5.5 0 0 1-5.4-4"/>
              <path d="m8 16.5 2-1.5 2 1.5M8 19.5V15"/>
            </svg>
          </a>
        </div>
        <a class="mark-later" data-od-id="cam-marklater" href="questify-dashboard.html">Mark later instead</a>
      </div>
      <div class="verdict-sheet" data-od-id="cam-verdict" role="dialog" aria-label="Verification result">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sage-banner" data-od-id="cam-verdict-banner">
          <span class="sb-ic" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
          </span>
          <div>
            <div class="sb-title">100% Match · Task Verified!</div>
            <div class="sb-sub">Bicep Workout · AI evaluated your photo proof</div>
          </div>
        </div>
        <div class="reward-row">
          <span class="reward">
            <span class="r-ic xp" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </span>
            +50 XP Earned
          </span>
          <span class="reward">
            <span class="r-ic trophy" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            </span>
            Daily Rank Preserved
          </span>
        </div>
        <div class="mascot-celebrate" data-od-id="cam-celebrate">
          <span class="celeb-flame" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          </span>
          <svg class="mascot-face" data-od-id="cam-questie" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Questie celebrating">
            <path d="M60 4 L74 26 Q60 36 46 26 Z" fill="#F4A261"/>
            <path d="M60 10 L68 24 Q60 29 52 24 Z" fill="#E76F51"/>
            <circle cx="60" cy="64" r="46" fill="#FFFFFF" stroke="#E7E7E8" stroke-width="2"/>
            <circle cx="48" cy="62" r="5" fill="#1A1B1E"/>
            <circle cx="72" cy="62" r="5" fill="#1A1B1E"/>
            <path d="M50 70 Q60 82 70 70" stroke="#1A1B1E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <circle cx="38" cy="70" r="6" fill="#E76F51" opacity=".25"/>
            <circle cx="82" cy="70" r="6" fill="#E76F51" opacity=".25"/>
          </svg>
          <span class="celeb-flame" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          </span>
        </div>
        <a class="done-btn" data-od-id="cam-done" href="questify-dashboard.html">Done ➔</a>
        <p class="fail-link"><a href="questify-dashboard.html">Photo doesn't match? Retake or mark later.</a></p>
      </div>
    </div>
  </div>
  <p class="stage-label">Questify · Photo Proof Camera · Module 3 · 390 × 844</p>
  <script>
    (function(){
      var shutter = document.querySelector('[data-od-id="cam-shutter"]');
      var photo = document.querySelector('[data-od-id="cam-photo"]');
      var scan = document.querySelector('[data-od-id="cam-scanline"]');
      var pill = document.querySelector('[data-od-id="cam-pill"]');
      var verdict = document.querySelector('[data-od-id="cam-verdict"]');
      var controls = document.querySelector('[data-od-id="cam-controls"]');
      var scanning = false;
      shutter.addEventListener('click', function(){
        if(scanning) return;
        scanning = true;
        photo.classList.add('on');
        scan.classList.add('on');
        pill.classList.add('scanning');
        pill.innerHTML = '<span class="spin"></span>Analyzing photo proof for Clean Room\u2026';
        setTimeout(function(){
          scan.classList.remove('on');
          pill.classList.remove('scanning');
          controls.style.visibility = 'hidden';
          verdict.classList.add('open');
        }, 2000);
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questify — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#FF6B35;
    --coral-deep:#E2551F;
    --canvas:#FAFAFA;
    --ink:#1A1B1E;
    --muted:#6B7280;
    --card-border:#E7E7E8;
    --white:#FFFFFF;
    --display:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--display);
    background:#ECECED;
    min-height:100vh;
    display:grid;
    place-items:center;
    gap:18px;
    padding:24px;
  }
  .stage-label{
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#6B7280;
    text-align:center;
    margin-top:-8px;
  }
  .phone{
    width:390px;
    height:844px;
    background:#1A1A1B;
    border-radius:54px;
    padding:10px;
    box-shadow:0 34px 70px rgba(26,27,30,.28),0 6px 16px rgba(26,27,30,.10);
    position:relative;
  }
  .screen{
    width:100%;
    height:100%;
    border-radius:46px;
    overflow:hidden;
    background:var(--canvas);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .island{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:126px;
    height:34px;
    background:#000;
    border-radius:20px;
    z-index:6;
  }
  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 28px 0;
    color:var(--ink);
    z-index:5;
  }
  .statusbar .time{font-size:15px;font-weight:700;letter-spacing:.02em}
  .status-icons{display:flex;align-items:center;gap:6px}
  .status-icons svg{display:block}
  .topbar{
    display:flex;
    align-items:center;
    padding:14px 20px 0;
  }
  .back-btn{
    width:44px;
    height:44px;
    border-radius:14px;
    border:1px solid var(--card-border);
    background:var(--white);
    display:grid;
    place-items:center;
    cursor:pointer;
    color:var(--ink);
    transition:transform .15s ease,background .15s ease;
  }
  .back-btn:hover{background:#FFFFFF}
  .back-btn:active{transform:scale(.95)}
  .auth-body{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 28px 24px;
  }
  .mascot-mini{width:56px;height:56px;margin-bottom:12px}
  .wordmark{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.01em;
    color:var(--ink);
    margin-bottom:20px;
  }
  .auth-title{
    font-size:26px;
    font-weight:800;
    letter-spacing:-.02em;
    color:var(--ink);
    margin-bottom:8px;
    text-align:center;
  }
  .auth-sub{
    font-size:15px;
    font-weight:500;
    color:var(--muted);
    text-align:center;
    margin-bottom:28px;
    line-height:1.5;
  }
  .field{
    width:100%;
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
  }
  .field input{
    width:100%;
    height:52px;
    border:1px solid var(--card-border);
    border-radius:14px;
    background:var(--white);
    padding:0 16px;
    font-family:var(--display);
    font-size:16px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .field input::placeholder{color:#A6ADB5}
  .field input:focus{
    border-color:var(--coral);
    box-shadow:0 0 0 3px rgba(255,107,53,.18);
  }
  .signin-btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:999px;
    background:var(--coral);
    color:var(--white);
    font-family:var(--display);
    font-size:17px;
    font-weight:700;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow:0 4px 0 var(--coral-deep);
    transition:transform .15s ease,box-shadow .15s ease;
    margin-top:6px;
  }
  .signin-btn:hover{filter:brightness(1.03)}
  .signin-btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 var(--coral-deep);
  }
  .alt-row{
    margin-top:20px;
    font-size:14px;
    font-weight:600;
    color:var(--muted);
    text-align:center;
  }
  .alt-row a{
    color:var(--coral);
    font-weight:700;
    text-decoration:none;
  }
  .alt-row a:active{text-decoration:underline}
</style>
</head>
<body>
  <div class="phone" data-od-id="login-screen">
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar" data-od-id="login-status">
        <span class="time">9:41</span>
        <span class="status-icons" aria-hidden="true">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
            <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/>
            <rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/>
            <rect x="10" y="2" width="3" height="10" rx="1" fill="currentColor"/>
            <rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".35"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
            <rect x="0" y="6" width="10" height="6" rx="2" fill="currentColor"/>
            <path d="M12 3.5a5 5 0 0 1 0 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M14 1a9 9 0 0 1 0 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
            <rect x="0" y="1" width="22" height="10" rx="3" fill="currentColor"/>
            <path d="M24 4v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <rect x="2" y="3" width="16" height="6" rx="1.5" fill="var(--coral)"/>
          </svg>
        </span>
      </div>
      <div class="topbar">
        <a class="back-btn" data-od-id="login-back" href="questify-splash.html" aria-label="Back to splash">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
      <div class="auth-body">
        <svg class="mascot-mini" data-od-id="login-mascot" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Questie the Questify mascot">
          <path d="M60 4 L74 26 Q60 36 46 26 Z" fill="#F4A261"/>
          <path d="M60 10 L68 24 Q60 29 52 24 Z" fill="#E76F51"/>
          <circle cx="60" cy="64" r="46" fill="#FFFFFF" stroke="#E7E7E8" stroke-width="2"/>
          <circle cx="48" cy="62" r="5" fill="#1A1B1E"/>
          <circle cx="72" cy="62" r="5" fill="#1A1B1E"/>
          <path d="M50 72 Q60 81 70 72" stroke="#1A1B1E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <circle cx="38" cy="70" r="6" fill="#E76F51" opacity=".25"/>
          <circle cx="82" cy="70" r="6" fill="#E76F51" opacity=".25"/>
        </svg>
        <div class="wordmark" data-od-id="login-brand">Questify</div>
        <h1 class="auth-title" data-od-id="login-title">Welcome back</h1>
        <p class="auth-sub" data-od-id="login-subtitle">Log in to continue your daily quests.</p>
        <form class="field" id="login-form" data-od-id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
          </div>
          <button class="signin-btn" data-od-id="login-submit" type="submit">Log In ➔</button>
        </form>
        <p class="alt-row" data-od-id="login-create">
          Don't have an account? <a href="questify-splash.html">Create one</a>
        </p>
      </div>
    </div>
  </div>
  <p class="stage-label">Questify · Log In · Returning user · 390 × 844</p>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e){
      e.preventDefault();
    });
  </script>
</body>
</html>

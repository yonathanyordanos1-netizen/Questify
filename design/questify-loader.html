<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questify — Logo Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#FF6B35;
    --coral-deep:#E2551F;
    --peach:#F2F2F3;
    --canvas:#FAFAFA;
    --ink:#1A1B1E;
    --card-border:#E7E7E8;
    --white:#FFFFFF;
    --display:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--display);
    background:#ECECED;
    min-height:100vh;
    display:grid;
    place-items:center;
    gap:18px;
    padding:24px;
  }
  .stage-label{
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#6B7280;
    text-align:center;
    margin-top:-8px;
  }
  .phone{
    width:390px;
    height:844px;
    background:#1A1A1B;
    border-radius:54px;
    padding:10px;
    box-shadow:0 34px 70px rgba(26,27,30,.28),0 6px 16px rgba(26,27,30,.10);
    position:relative;
  }
  .screen{
    width:100%;
    height:100%;
    border-radius:46px;
    overflow:hidden;
    background:var(--coral);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .island{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:126px;
    height:34px;
    background:#000;
    border-radius:20px;
    z-index:6;
  }
  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 28px 0;
    color:var(--white);
    z-index:5;
  }
  .statusbar .time{font-size:15px;font-weight:700;letter-spacing:.02em}
  .status-icons{display:flex;align-items:center;gap:6px}
  .status-icons svg{display:block}
  .logo-zone{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding-bottom:48px;
  }
  .mascot{
    width:128px;
    height:128px;
    filter:drop-shadow(0 14px 28px rgba(26,27,30,.25));
    animation:pop-in .5s cubic-bezier(.2,.9,.3,1.2);
  }
  .wordmark{
    font-size:44px;
    font-weight:800;
    letter-spacing:-.02em;
    color:var(--white);
    text-shadow:0 2px 0 rgba(26,27,30,.12);
    animation:fade-up .5s ease-out .15s backwards;
  }
  .wordmark em{
    font-style:normal;
    color:var(--peach);
  }
  .tagline{
    font-size:15px;
    font-weight:600;
    letter-spacing:.04em;
    color:rgba(255,255,255,.88);
    text-transform:uppercase;
    animation:fade-up .5s ease-out .25s backwards;
  }
  .loadbar{
    width:160px;
    height:5px;
    border-radius:999px;
    background:rgba(255,255,255,.28);
    overflow:hidden;
    animation:fade-up .5s ease-out .35s backwards;
  }
  .loadbar-fill{
    display:block;
    height:100%;
    width:0;
    border-radius:999px;
    background:var(--white);
    animation:fill 2.2s ease-out .4s forwards;
  }
  @keyframes pop-in{
    from{opacity:0;transform:scale(.82)}
    to{opacity:1;transform:scale(1)}
  }
  @keyframes fade-up{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes fill{
    to{width:100%}
  }
</style>
</head>
<body>
  <div class="phone" data-od-id="loader-screen">
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar" data-od-id="loader-status">
        <span class="time">9:41</span>
        <span class="status-icons" aria-hidden="true">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
            <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/>
            <rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/>
            <rect x="10" y="2" width="3" height="10" rx="1" fill="currentColor"/>
            <rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".35"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
            <rect x="0" y="6" width="10" height="6" rx="2" fill="currentColor"/>
            <path d="M12 3.5a5 5 0 0 1 0 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M14 1a9 9 0 0 1 0 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
            <rect x="0" y="1" width="22" height="10" rx="3" fill="currentColor"/>
            <path d="M24 4v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <rect x="2" y="3" width="16" height="6" rx="1.5" fill="var(--coral-deep)"/>
          </svg>
        </span>
      </div>
      <div class="logo-zone" data-od-id="loader-logo">
        <div class="mascot" aria-hidden="true">
          <svg width="128" height="128" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <path d="M60 4 L74 26 Q60 36 46 26 Z" fill="#F4A261"/>
            <path d="M60 10 L68 24 Q60 29 52 24 Z" fill="#D85E40"/>
            <circle cx="60" cy="64" r="46" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
            <circle cx="48" cy="62" r="5" fill="#1A1B1E"/>
            <circle cx="72" cy="62" r="5" fill="#1A1B1E"/>
            <path d="M50 72 Q60 81 70 72" stroke="#1A1B1E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <circle cx="38" cy="70" r="6" fill="#E76F51" opacity=".25"/>
            <circle cx="82" cy="70" r="6" fill="#E76F51" opacity=".25"/>
          </svg>
        </div>
        <h1 class="wordmark" data-od-id="loader-wordmark">Quest<em>ify</em></h1>
        <p class="tagline" data-od-id="loader-tagline">Habits · Ranked</p>
        <div class="loadbar" data-od-id="loader-bar" aria-hidden="true">
          <span class="loadbar-fill"></span>
        </div>
      </div>
    </div>
  </div>
  <p class="stage-label">Questify · Logo Splash · Loading · 390 × 844</p>
  <script>
    setTimeout(function(){
      var screen=document.querySelector('.screen');
      screen.style.transition='opacity .35s ease';
      screen.style.opacity='0';
      setTimeout(function(){window.location.href='questify-splash.html';},350);
    },2700);
  </script>
</body>
</html>

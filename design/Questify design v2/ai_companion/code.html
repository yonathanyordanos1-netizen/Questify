<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Questify Coach</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#5f1900",
                        "on-primary-fixed": "#390c00",
                        "outline": "#8d7168",
                        "tertiary": "#515f74",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#ffb59d",
                        "surface-container": "#eceef1",
                        "on-tertiary-container": "#243245",
                        "surface-container-high": "#e6e8eb",
                        "outline-variant": "#e1bfb5",
                        "surface-tint": "#ab3500",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#eff1f4",
                        "tertiary-fixed-dim": "#b9c7df",
                        "tertiary-fixed": "#d5e3fc",
                        "surface-container-highest": "#e0e3e6",
                        "secondary": "#565e74",
                        "on-error": "#ffffff",
                        "on-surface": "#191c1e",
                        "inverse-primary": "#ffb59d",
                        "on-secondary-fixed": "#131b2e",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#8c9ab1",
                        "on-primary-fixed-variant": "#832600",
                        "on-secondary-fixed-variant": "#3f465c",
                        "primary-container": "#ff6b35",
                        "secondary-container": "#dae2fd",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f2f4f7",
                        "on-surface-variant": "#594139",
                        "surface-variant": "#e0e3e6",
                        "secondary-fixed-dim": "#bec6e0",
                        "error": "#ba1a1a",
                        "primary": "#ab3500",
                        "on-tertiary-fixed": "#0d1c2e",
                        "on-primary": "#ffffff",
                        "surface-dim": "#d8dadd",
                        "on-tertiary-fixed-variant": "#3a485b",
                        "background": "#f7f9fc",
                        "surface-bright": "#f7f9fc",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#191c1e",
                        "primary-fixed": "#ffdbd0",
                        "on-secondary-container": "#5c647a",
                        "inverse-surface": "#2d3133",
                        "surface": "#f7f9fc",
                        "secondary-fixed": "#dae2fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "xl": "64px",
                        "container-max": "1200px",
                        "base": "4px",
                        "gutter": "16px",
                        "md": "24px",
                        "margin-mobile": "20px",
                        "lg": "40px",
                        "sm": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "button": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-bold": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "button": ["16px", { "lineHeight": "1", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "800" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-bold": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #e0e3e6;
            border-radius: 20px;
        }
        .animate-bounce-slight {
            animation: bounce-slight 2s infinite ease-in-out;
        }
        @keyframes bounce-slight {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Top Navigation Area -->
<header class="bg-background dark:bg-background flex justify-between items-center w-full px-margin-mobile h-16 sticky top-0 z-10">
<button aria-label="Go back" class="text-on-surface-variant hover:opacity-80 transition-opacity p-2 -ml-2 rounded-full active:scale-95 duration-100">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-extrabold text-primary dark:text-primary-fixed-dim">Questify Coach</h1>
<button aria-label="More options" class="text-on-surface-variant hover:opacity-80 transition-opacity p-2 -mr-2 rounded-full active:scale-95 duration-100">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col w-full max-w-container-max mx-auto px-margin-mobile md:px-lg relative h-[calc(100vh-64px)] overflow-hidden">
<!-- Interactive Mascot Display Area -->
<div class="flex-shrink-0 w-full flex flex-col items-center justify-center pt-md pb-sm relative z-0">
<div class="w-48 h-48 md:w-64 md:h-64 rounded-full bg-white shadow-lg flex items-center justify-center p-2 mb-4 animate-bounce-slight border-4 border-primary-container relative overflow-hidden">
<img alt="QUBI AI Mascot" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida/AP1WRLtDWG9In3Nhfig2yyW4ZY1vs6ME5PQ_Et5BCi8PpH1d-gQt_uVxERQSdYXZJlQEE2eagW4582hVyIdSScOwaZ5hT-Yh2A5GwKqyWr466DTmeTrmkE90Bq1_VvIomH9RKpo5_GjCF-7xLebkGNAaX4_Uhqap4znmafAV4ogdYTKe-pAHkW6Osy0RFBhxgn8uQ3zUT3USc3k8lZU0NQkZSOlHGD0J0Mjr8G9_gAD0CAg_fOpGyfjuYGV4caC1"/>
</div>
<div class="bg-white px-4 py-2 rounded-full shadow-sm border border-surface-container-high">
<p class="text-label-bold font-label-bold text-on-surface-variant flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-green-500 block"></span>
                    QUBI is listening...
                </p>
</div>
</div>
<!-- Chat History -->
<div class="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-sm pb-24 pt-sm px-2 relative z-10" id="chat-container">
<!-- AI Message -->
<div class="flex w-full justify-start">
<div class="max-w-[85%] md:max-w-[70%] flex gap-3 items-end">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex-shrink-0 overflow-hidden hidden sm:block shadow-sm">
<img alt="QUBI" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLtDWG9In3Nhfig2yyW4ZY1vs6ME5PQ_Et5BCi8PpH1d-gQt_uVxERQSdYXZJlQEE2eagW4582hVyIdSScOwaZ5hT-Yh2A5GwKqyWr466DTmeTrmkE90Bq1_VvIomH9RKpo5_GjCF-7xLebkGNAaX4_Uhqap4znmafAV4ogdYTKe-pAHkW6Osy0RFBhxgn8uQ3zUT3USc3k8lZU0NQkZSOlHGD0J0Mjr8G9_gAD0CAg_fOpGyfjuYGV4caC1"/>
</div>
<div class="bg-white text-on-surface p-4 rounded-2xl rounded-bl-sm shadow-[0px_4px_20px_rgba(15,23,42,0.05)] border border-surface-container-lowest">
<p class="text-body-md font-body-md">You haven't logged your morning workout yet. Need a nudge?</p>
</div>
</div>
</div>
<!-- User Message -->
<div class="flex w-full justify-end">
<div class="max-w-[85%] md:max-w-[70%]">
<div class="bg-primary-container text-white p-4 rounded-2xl rounded-br-sm shadow-md">
<p class="text-body-md font-body-md">I'll do it in 10 minutes!</p>
</div>
</div>
</div>
<!-- Typing Indicator (Simulated) -->
<div class="flex w-full justify-start mt-2">
<div class="max-w-[85%] flex gap-3 items-end">
<div class="bg-white p-4 rounded-2xl rounded-bl-sm shadow-[0px_4px_20px_rgba(15,23,42,0.05)] border border-surface-container-lowest flex gap-1">
<span class="w-2 h-2 bg-on-surface-variant rounded-full animate-pulse"></span>
<span class="w-2 h-2 bg-on-surface-variant rounded-full animate-pulse delay-75"></span>
<span class="w-2 h-2 bg-on-surface-variant rounded-full animate-pulse delay-150"></span>
</div>
</div>
</div>
</div>
<!-- Input Area (Fixed to bottom of content area) -->
<div class="absolute bottom-0 left-0 w-full px-margin-mobile md:px-lg pb-margin-mobile pt-4 bg-gradient-to-t from-background via-background to-transparent z-20">
<div class="max-w-container-max mx-auto w-full">
<div class="relative bg-white rounded-2xl shadow-lg flex items-center p-2 border-2 border-surface-container focus-within:border-primary-container transition-colors duration-200">
<button aria-label="Attach file" class="p-2 text-on-surface-variant hover:bg-surface-container-lowest rounded-full transition-colors">
<span class="material-symbols-outlined">add_circle</span>
</button>
<input aria-label="Message input" class="flex-1 bg-transparent border-none focus:ring-0 text-body-md font-body-md text-on-surface placeholder-on-surface-variant px-3 py-3 w-full" placeholder="Ask your Questify Coach..." type="text"/>
<button aria-label="Send message" class="p-3 bg-primary-container text-white rounded-xl hover:scale-[1.02] active:scale-95 transition-all shadow-md ml-2 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
</div>
</main>
<script>
        // Auto-scroll to bottom of chat
        document.addEventListener('DOMContentLoaded', (event) => {
            const chatContainer = document.getElementById('chat-container');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    </script>
</body></html>

<p class="text-body-md font-body-md text-on-surface-variant">Shape your destiny. Allocate XP to grow.</p>
</header>
<!-- Skill Tree Visualization -->
<div class="relative max-w-md mx-auto">
<!-- Structural Connecting Lines (Background) -->
<div class="absolute inset-0 pointer-events-none z-0">
<!-- Center vertical stem -->
<div class="absolute top-[10%] bottom-[10%] left-1/2 w-1 bg-surface-variant -translate-x-1/2 rounded-full"></div>
<!-- Horizontal branches -->
<div class="absolute top-[25%] left-[25%] right-[25%] h-1 bg-surface-variant rounded-full"></div>
<div class="absolute top-[75%] left-[25%] right-[25%] h-1 bg-surface-variant rounded-full"></div>
</div>

<div class="flex items-center gap-xs mb-md">

</div>

<span>800</span>
<span>1000 XP</span>
</div>

</div>

<div class="flex items-center gap-xs mb-md">
<div class="w-10 h-10 rounded-full bg-tertiary-container text-on-tertiary-container flex items-center justify-center text-xl">

                        </div>

</div>

<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Questify - Proof Camera</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#5f1900",
                        "on-primary-fixed": "#390c00",
                        "outline": "#8d7168",
                        "tertiary": "#515f74",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#ffb59d",
                        "surface-container": "#eceef1",
                        "on-tertiary-container": "#243245",
                        "surface-container-high": "#e6e8eb",
                        "outline-variant": "#e1bfb5",
                        "surface-tint": "#ab3500",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#eff1f4",
                        "tertiary-fixed-dim": "#b9c7df",
                        "tertiary-fixed": "#d5e3fc",
                        "surface-container-highest": "#e0e3e6",
                        "secondary": "#565e74",
                        "on-error": "#ffffff",
                        "on-surface": "#191c1e",
                        "inverse-primary": "#ffb59d",
                        "on-secondary-fixed": "#131b2e",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#8c9ab1",
                        "on-primary-fixed-variant": "#832600",
                        "on-secondary-fixed-variant": "#3f465c",
                        "primary-container": "#ff6b35",
                        "secondary-container": "#dae2fd",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f2f4f7",
                        "on-surface-variant": "#594139",
                        "surface-variant": "#e0e3e6",
                        "secondary-fixed-dim": "#bec6e0",
                        "error": "#ba1a1a",
                        "primary": "#ab3500",
                        "on-tertiary-fixed": "#0d1c2e",
                        "on-primary": "#ffffff",
                        "surface-dim": "#d8dadd",
                        "on-tertiary-fixed-variant": "#3a485b",
                        "background": "#f7f9fc",
                        "surface-bright": "#f7f9fc",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#191c1e",
                        "primary-fixed": "#ffdbd0",
                        "on-secondary-container": "#5c647a",
                        "inverse-surface": "#2d3133",
                        "surface": "#f7f9fc",
                        "secondary-fixed": "#dae2fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "xl": "64px",
                        "container-max": "1200px",
                        "base": "4px",
                        "gutter": "16px",
                        "md": "24px",
                        "margin-mobile": "20px",
                        "lg": "40px",
                        "sm": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "button": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-bold": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "button": ["16px", { "lineHeight": "1", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "800" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-bold": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        .scan-line {
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(200px); opacity: 0; }
        }
        .reticle-corner {
            width: 24px;
            height: 24px;
            border-color: #ff6b35; /* primary-container */
            border-style: solid;
            position: absolute;
        }
        .tl { top: 0; left: 0; border-width: 4px 0 0 4px; }
        .tr { top: 0; right: 0; border-width: 4px 4px 0 0; }
        .bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; }
        .br { bottom: 0; right: 0; border-width: 0 4px 4px 0; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black text-white h-screen w-full overflow-hidden relative">
<!-- Simulated Camera Feed Background -->
<div class="absolute inset-0 bg-cover bg-center w-full h-full opacity-60" data-alt="A blurred, low-light modern gym interior viewed through a camera lens. The scene is slightly dark with subtle bokeh effects from overhead lights. The overall tone is moody and technical, typical of a smartphone camera attempting to focus in a dim environment. The aesthetic is clean, modern, and slightly desaturated." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCdxgRhw87ffW5O6UOKm0WKalObY8IcbKB70PzvWJGIIjAqHBPxCSqca6oOKuH8NWtRVTMtKM9x2mHP9oyFhppZH8yXM7nhoh2E_QesHMCGeGMk2grBgWMdDA4r_Z-RszfEC72FbswanFCIrkmpxFui05pRDIkGDjxGCwwvvKBjpEmwkjZj2ZXYLYKtRKBOmXVtOjnmBeg0ZQrKdbjETO1ssRfUcfPJUoV3a0UNzaQbOBZkAlznM1-IeA')"></div>
<!-- Dark Glass Overlay -->
<div class="absolute inset-0 bg-black/40 backdrop-blur-sm pointer-events-none"></div>
<!-- UI Overlay -->
<div class="absolute inset-0 flex flex-col justify-between z-10 p-margin-mobile">
<!-- Header -->
<header class="flex justify-between items-start w-full">
<div class="flex flex-col">
<span class="text-primary-fixed-dim font-label-bold text-label-bold uppercase tracking-wider mb-1">Quest Verification</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-white">Morning Workout</h1>
</div>
<button class="w-12 h-12 rounded-full bg-surface-inverse/20 backdrop-blur-md flex items-center justify-center text-white hover:bg-surface-inverse/40 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<!-- Center Reticle & Scanning Area -->
<div class="flex-grow flex flex-col items-center justify-center relative w-full max-w-sm mx-auto my-lg">
<!-- AI Reticle -->
<div class="relative w-64 h-64 border border-white/20">
<div class="reticle-corner tl"></div>
<div class="reticle-corner tr"></div>
<div class="reticle-corner bl"></div>
<div class="reticle-corner br"></div>
<!-- Scanning Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary-container shadow-[0_0_15px_rgba(255,107,53,0.8)] scan-line z-20"></div>
<!-- Crosshairs -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center opacity-30">
<span class="material-symbols-outlined text-white" style="font-size: 48px;">center_focus_strong</span>
</div>
</div>
<p class="mt-lg font-body-md text-body-md text-white/90 text-center max-w-[280px]">
                Show proof that you completed your quest. Ensure good lighting.
            </p>
</div>
<!-- Bottom Controls -->
<div class="flex flex-col items-center pb-md">
<!-- Capture Button -->
<button class="relative w-20 h-20 rounded-full border-4 border-white flex items-center justify-center group active:scale-95 transition-transform duration-200">
<div class="w-16 h-16 rounded-full bg-primary-container shadow-[0_0_20px_rgba(255,107,53,0.5)] group-hover:bg-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 32px; font-variation-settings: 'FILL' 1;">camera</span>
</div>
</button>
<!-- Secondary Tools (Optional for realism) -->
<div class="flex gap-lg mt-md opacity-70">
<button class="flex flex-col items-center text-white hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined mb-1">flash_off</span>
<span class="font-label-bold text-[10px]">FLASH</span>
</button>
<button class="flex flex-col items-center text-white hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined mb-1">flip_camera_ios</span>
<span class="font-label-bold text-[10px]">FLIP</span>
</button>
</div>
</div>
</div>
</body></html>

name: questify
description: "Questify — Notion-level habit tracking with Duolingo-style streaks & leagues."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  provider: ^6.1.2
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.2
  http: ^1.2.2
  url_launcher: ^6.3.0
  supabase_flutter: ^2.3.0
  google_sign_in: ^6.2.1
  flutter_dotenv: ^5.1.0
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  camera: ^0.11.0+2
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/images/
    - .env
